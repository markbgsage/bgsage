[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "bgsage"
version = "2.0.20260907"
description = "Open Sage bot engine — a neural-network backgammon engine"
readme = "README.md"
license = "MPL-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Mark Higgins" },
]
keywords = ["backgammon", "neural-network", "game-ai"]
dependencies = [
    "numpy>=1.24",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/markbgsage/bgsage"
Repository = "https://github.com/markbgsage/bgsage"
Issues = "https://github.com/markbgsage/bgsage/issues"

# ---------------------------------------------------------------------------
# scikit-build-core: CMake-driven build of the pybind11 extension (bgbot_cpp)
# ---------------------------------------------------------------------------
[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
# The Python package tree lives under python/, not at the repo root.
wheel.packages = ["python/bgsage"]

# sdist contents: by default scikit-build-core ships every git-tracked file.
#
# This repo tracks ~1 GB of training/benchmark/reference data, and PyPI caps a
# single file at 100 MB. So the policy here is an ALLOWLIST, not a denylist:
# exclude whole trees, then re-add only the handful of files a source build
# actually needs. A denylist was tried first and did not hold — each new
# dataset (money_benchmark, backgame_ref_positions, match_benchmark, …) slipped
# through unnoticed and the sdist grew from 9 MB to 535 MB before this caught it.
sdist.exclude = [
    "data/",
    "models/",
    "backgame_ref_positions/",
    "assets/",
    "scripts/",
    "tests/",
    "logs/",
]
# Re-added after the excludes above. These patterns contain a "/", so they are
# anchored to the repo root and cannot match copies under .claude/worktrees/.
sdist.include = [
    "data/bearoff_1sided.db",
    "models/sl_s9_*.weights.best",
    "models/sl_s11_*.weights.best",
]

# ---------------------------------------------------------------------------
# cibuildwheel: build wheels for Py 3.10-3.13 on Linux/macOS/Windows
# ---------------------------------------------------------------------------
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = [
    "*-musllinux_*",    # glibc only
    "*_i686",           # no 32-bit
    "*-win32",          # no 32-bit Windows
    "pp*",              # no PyPy
]
build-verbosity = 1
# Smoke-test the built wheel: import the package, run a trivial analysis.
test-command = "python -c \"from bgsage import BgBotAnalyzer, STARTING_BOARD; a = BgBotAnalyzer(); r = a.checker_play(STARTING_BOARD, 3, 1); print('ok', r.moves[0].equity)\""

[tool.cibuildwheel.linux]
# manylinux_2_28 gives us GCC 12+ which supports -mavx2/-mfma out of the box.
# The compiled binary requires AVX2 (Haswell+, 2013+).
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
# Universal build: Intel (x86_64) and Apple Silicon (arm64).
archs = ["x86_64", "arm64"]
# arm64 uses NEON; x86_64 uses AVX2 (set in CMakeLists_cpu.txt).

[tool.cibuildwheel.windows]
archs = ["AMD64"]
